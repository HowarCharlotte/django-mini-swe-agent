name: Check migrations

on:
  pull_request:
    paths:
      - 'tests/**/models.py'
      - 'tests/**/migrations/**'
      - 'tests/**/*migrations/**/*.py'
      - 'scripts/check_migrations.py'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  check-migrations:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: test_postgres
      PYTHONPATH: .:tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tests/requirements/py3.txt
            tests/requirements/postgres.txt
      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/data/apt-packages.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r tests/requirements/py3.txt -r tests/requirements/postgres.txt
      - name: Prepare PostgreSQL test settings
        run: cp .github/workflows/data/test_postgres.py.tpl tests/test_postgres.py
      - name: Run check migrations
        run: python scripts/check_migrations.py
